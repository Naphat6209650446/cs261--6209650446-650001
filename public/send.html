<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบฟอร์มการยื่นคำร้องของนักศึกษา</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f9f9f9;
        }

        .logo {
            margin-bottom: 10px;
        }

        .logo img {
            max-width: 250px;
        }

        .header {
            background-color: #ffffff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            border-bottom: 2px solid #8d1b3d;
        }

        .header h1 {
            font-size: 24px;
            color: #8d1b3d;
            font-weight: bold;
        }

        .header .user-info {
            display: flex;
            align-items: center;
            font-size: 16px;
            color: #555;
        }

        .header .user-info img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-left: 10px;
        }

        .navbar {
            background-color: #3c3434;
            color: white;
            display: flex;
            justify-content: space-evenly;
            padding: 10px 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            padding: 10px 20px;
            border-radius: 20px;
            transition: background-color 0.3s;
        }

        .navbar a.active {
            background-color: #8d1b3d;
        }

        .navbar a:hover {
            background-color: #5e5151;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .form-title {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .success-message {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 200px;
            background-color: #f9f9f9;
            border: 2px solid #ccc;
            border-radius: 15px;
            padding: 30px;
            color: #333;
            font-size: 20px;
            font-weight: bold;
            justify-content: center; /* จัดตำแหน่งในแนวตั้ง */
            align-items: center; /* จัดตำแหน่งในแนวนอน */
        }

        .success-icon {
            font-size: 40px;
            color: #8d1b3d;
            margin-bottom: 20px;
        }

        .submit-btn {
            background-color: #E7CA29;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 30px;
            cursor: pointer;
            width: 15%;
            font-size: 16px;
            text-align: center;
            margin-top: 30px;
        }

        .submit-btn:hover {
            background-color: #d3b427;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <img src="img/TU-text.png" alt="Thammasat University Logo">
        </div>
        <div class="user-info">
            <span>Naphat Torungruengyos</span>
            <img src="img/acc1.png" alt="User Avatar">
        </div>
    </div>

    <!-- Navbar -->
    <div class="navbar">
        <a href="#" class="active">เขียนคำร้อง</a>
        <a href="#">ติดตามสถานะคำร้อง</a>
        <a href="#">ประวัติการยื่นคำร้อง</a>
    </div>

    <!-- Container -->
    <div class="container">
        <h2 class="form-title">แบบฟอร์มการยื่นคำร้องของนักศึกษา</h2>
        <div class="success-message">
            <div class="success-icon" style=" text-align: center;">✔️</div>
            ส่งคำร้อง สำเร็จ!
        </div>
        <button class="submit-btn" onclick="window.location.href='loginSucc.html'">ตกลง</button>
    </div>
</body>
</html>
