<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติการยื่นคำร้อง</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f9f9f9;
        }

        .logo {
            margin-bottom: 10px;
        }

        .logo img {
            max-width: 250px;
        }

        .header {
            background-color: #ffffff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            border-bottom: 2px solid #8d1b3d;
        }

        .header h1 {
            font-size: 24px;
            color: #8d1b3d;
            font-weight: bold;
        }

        .header .user-info {
            display: flex;
            align-items: center;
            font-size: 16px;
            color: #555;
        }

        .header .user-info img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-left: 10px;
        }

        .navbar {
            background-color: #3c3434;
            color: white;
            display: flex;
            justify-content: space-evenly;
            padding: 10px 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            padding: 10px 20px;
            border-radius: 20px;
            transition: background-color 0.3s;
        }

        .navbar a.active {
            background-color: #8d1b3d;
        }

        .navbar a:hover {
            background-color: #5e5151;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            text-align: left;
        }

        .container h2 {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .status-info {
            background: #f9f9f9;
            border-left: 5px solid #8d1b3d;
            border: 1px solid #332c2c92;
            border-radius: 20px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .status-info .status-content {
            margin-bottom: 8px;
            color: #3c3a3a;
        }

        .status-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
        }

        .status-actions button {
            width: 80px; 
            border-radius: 20px;
            padding: 5px 15px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s;
            text-align: center;
        }

        .status-actions button:nth-child(1) {
            background-color: #E7CA29;
            color: rgb(0, 0, 0);
        }

        .status-actions button:nth-child(1):hover {
            background-color: #d3b427;
        }

        .status-actions button:nth-child(2) {
            background-color: #e74c3c;
            color: rgb(8, 8, 8);
        }

        .status-actions button:nth-child(2):hover {
            background-color: #c0392b;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }

        .modal-content h3 {
            margin: 10px 0;
            color: #333;
        }

        .modal-content p {
            margin: 15px 0;
            color: #555;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .modal-buttons button {
            width: 100px;
            border-radius: 20px;
            padding: 8px 10px;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }

        .modal-buttons button.confirm {
            background-color: #3498db;
            color: white;
        }

        .modal-buttons button.cancel {
            background-color: #e74c3c;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <img src="img/TU-text.png" alt="Thammasat University Logo">
        </div>
        <div class="user-info">
            <span>Naphat Torungruengyos</span>
            <img src="img/acc1.png" alt="User Avatar">
        </div>
    </div>

    <!-- Navbar -->
    <div class="navbar">
        <a href="#">เขียนคำร้อง</a>
        <a href="#">ติดตามสถานะคำร้อง</a>
        <a href="#" class="active">ประวัติการยื่นคำร้อง</a>
    </div>

    <!-- Container for status history -->
    <div class="container">
        <h2>ประวัติการยื่นคำร้องทั้งหมด</h2>
        
        <div class="status-info">
            <div>
                <div class="status-content"><strong>เรื่อง:</strong> จดทะเบียนล่าช้า</div>
                <div class="status-content"><strong>วันที่ยื่นเรื่อง:</strong> 15/11/2024</div>
                <div class="status-content"><strong>เวลา:</strong> 1:27:00 PM</div>
            </div>

            <div class="status-actions">
                <button>แก้ไข</button>
                <button id="cancelBtn">ยกเลิก</button>
            </div>
        </div>

        <!-- Modal -->
        <div class="modal" id="cancelModal">
            <div class="modal-content">
                <h3>ยกเลิกคำร้อง</h3>
                <p>เรื่อง: จดทะเบียนล่าช้า</p>
                <div class="modal-buttons">
                    <button class="confirm" id="confirmBtn">ยืนยัน</button>
                    <button class="cancel" id="closeModal">ยกเลิก</button>
                </div>
            </div>
        </div>
    
        <script>
            // Modal Elements
            const modal = document.getElementById('cancelModal');
            const cancelBtn = document.getElementById('cancelBtn');
            const closeModal = document.getElementById('closeModal');
            const confirmBtn = document.getElementById('confirmBtn');
    
            // Show Modal on Cancel Button Click
            cancelBtn.addEventListener('click', () => {
                modal.style.display = 'flex';
            });
    
            // Close Modal on Cancel Button in Modal
            closeModal.addEventListener('click', () => {
                modal.style.display = 'none';
            });
    
            // Confirm Action
            confirmBtn.addEventListener('click', () => {
                alert('ยืนยันการยกเลิกคำร้อง');
                modal.style.display = 'none';
            });
    
            // Close Modal When Clicking Outside the Modal Content
            window.addEventListener('click', (event) => {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });
        </script>

        <div style="text-align: center; margin-top: 20px;">
            <button style="background-color: #8d1b3d; color: white; border-radius: 20px; padding: 10px 20px; border: none;">ดูทั้งหมด</button>
        </div>
    </div>
</body>
</html>
