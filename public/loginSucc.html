<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thammasat University</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            min-height: 400px; /* กำหนดความสูงขั้นต่ำ */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border: 1px solid #d3d3d3;
        }

        .logo {
            margin-bottom: 20px;
        }

        .logo img {
            max-width: 400px;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            color: #d32f2f;
            margin: 10px 0;
        }

        .subtitle {
            font-size: 16px;
            color: #333;
            margin-bottom: 30px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px; /* เพิ่มระยะห่างด้านบนของกลุ่มไอคอน */
        }

        .menu-row {
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 2px solid #d32f2f; /* เปลี่ยนเป็นสีแดง */
            border-radius: 50%;
            width: 80px; /* ลดขนาดวงกลม */
            height: 80px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            position: relative; /* เพื่อจัดตำแหน่งตัวหนังสือ */
            margin: 0 20px; /* เพิ่มระยะห่างแนวนอนระหว่างไอคอน */
        }

        .menu-item img {
            width: 40px; /* ลดขนาดไอคอน */
            height: auto;
        }

        .menu-item span {
            font-size: 14px;
            color: #555;
            text-align: center;
            position: absolute; /* จัดให้อยู่ข้างล่าง */
            bottom: -30px; /* เลื่อนข้อความลง (เพิ่มจากเดิม) */
            width: 100%; /* ให้ข้อความขยายเต็มความกว้าง */
        }

        /* ข้อความในแถวล่าง */
        .menu-item .row-2-text {
            bottom: -50px; /* ขยับลงเพิ่มเฉพาะข้อความแถวล่าง */
        }

        .menu-item:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .row-2 {
            margin-top: 30px; /* เพิ่มระยะห่างระหว่างแถวแรกกับแถวสอง */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="img/TU-text.png" alt="Thammasat University Logo">
        </div>
        <div class="menu">
            <!-- แถวที่ 1: ข้อมูลของคุณ, เขียนคำร้อง -->
            <div class="menu-row">
                <a href="#" class="menu-item">
                    <img src="img/acc1.png" alt="ข้อมูลของคุณ">
                    <span>ข้อมูลของคุณ</span>
                </a>
                <a href="req.html" class="menu-item">
                    <img src="img/write.png" alt="เขียนคำร้อง">
                    <span>เขียนคำร้อง</span>
                </a>
            </div>
            <!-- แถวที่ 2: ติดตามสถานะคำร้อง, ประวัติการยื่นคำร้อง -->
            <div class="menu-row row-2">
                <a href="track-status.html" class="menu-item">
                    <img src="img/acc.png" alt="ติดตามสถานะคำร้อง">
                    <span class="row-2-text">ติดตามสถานะคำร้อง</span>
                </a>
                
                <a href="status.html" class="menu-item">
                    <img src="img/time.png" alt="ประวัติการยื่นคำร้อง">
                    <span class="row-2-text">ประวัติการยื่นคำร้อง</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
