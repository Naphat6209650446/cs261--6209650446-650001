<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบฟอร์มการยื่นคำร้องของนักศึกษา</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f9f9f9;
        }

        .header {
            background-color: #ffffff;
            color: rgb(9, 9, 9);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 0 0 50px 50px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header .user-info {
            display: flex;
            align-items: center;
        }

        .header .user-info span {
            margin-right: 10px;
            font-size: 14px;
        }

        .header .user-info img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }

        .navbar {
            background-color: #3c3434;
            color: white;
            display: flex;
            padding: 10px 20px;
            justify-content: space-evenly;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-size: 18px;
            padding: 5px 15px;
            font-weight: bold;
        }

        .navbar a.active {
            background-color: #8d1b3d;
            border-radius: 20px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto; 
            background: white;
            padding: 40px; /* เพิ่ม padding ภายใน */
            border-radius: 50px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            flex-direction: column; /* เรียงในแนวตั้ง */
            align-items: center;    /* จัดให้อยู่กลางในแนวนอน */
            justify-content: center; /* จัดให้อยู่กลางในแนวตั้ง */
        }

        .form-title {
            text-align: center;
            font-size: 25px;
            margin-bottom: 20px;
            color: #121212;
        }

        .form-group {
            margin: 10px 0;
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input {
            width: 90%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 30px;
            font-size: 14px;
        }

        .form-row {
            display: flex;
            gap: 10px;
            justify-content: space-between; /* กระจายช่องว่างระหว่างฟิลด์ */
        }

        .form-row .form-group {
            flex: 1;
        }

        .icon {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 10px;
            font-size: 14px;
            color: #333;
        }

        .icon img {
            width: 20px;
            height: 20px;
        }

        .icon span {
            font-size: 18px;
            font-weight: bold;
        }

        .logo {
            margin-bottom: 10px;
        }

        .logo img {
            max-width: 250px;
        }

        .button-wrapper {
            display: flex;
            justify-content: center; /* จัดให้อยู่กลางในแนวนอน */
            width: 100%;            /* ครอบคลุมความกว้างทั้งหมดของหน้าจอ */
        }

        .submit-btn {
            background-color: #E7CA29;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 30px;
            cursor: pointer;
            width: 15%;
            font-size: 16px;
            text-align: center;
        }

        .submit-btn:hover {
            background-color: #e7cb2980;
        }

        .select-container {
            position: relative;
            width: 100%;
        }
        
        .centered-dropdown {
            width: 100%;
            padding: 10px;
            border: 1px solid #8d1b3d;
            border-radius: 30px;
            background-color: white;
            color: #121212;
            font-size: 14px;
            text-align: center; /* ทำให้ข้อความอยู่ตรงกลาง */
            appearance: none; /* ซ่อนลูกศรเดิมของ select */
            -webkit-appearance: none;
            -moz-appearance: none;
        }

        .dropdown-wrapper {
            position: relative;
            width: 20%;
        }

        .dropdown-wrapper::after {
            content: '\25BC'; /* ลูกศรชี้ลง */
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            pointer-events: none;
            color: #473e41;
        }      

        select {
            width: 18%;
            padding: 10px;
            border: 1px solid #8d1b3d;
            border-radius: 30px;
            background-color: white;
            color: #121212;
            font-size: 14px;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }

        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px; /* กรอบมน */
            font-size: 14px;
            resize: none; /* ป้องกันการเปลี่ยนขนาด */
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="img/TU-text.png" alt="Thammasat University Logo">
        </div>
        <div class="user-info">
            <span>Naphat Torungruengyos</span>
            <img src="img/acc1.png" alt="User Avatar">
        </div>
    </div>

    <div class="navbar">
        <a href="#" class="active">เขียนคำร้อง</a>
        <a href="#">ติดตามสถานะคำร้อง</a>
        <a href="#">ประวัติการยื่นคำร้อง</a>
    </div>

    <div class="container">
        <h2 class="form-title">แบบฟอร์มการยื่นคำร้องของนักศึกษา</h2>
        <form>
            <div class="form-group">
                <label for="date">วันที่</label>
                <input type="date" id="date" name="date">
            </div>

            <div class="icon">
                <span>ข้อมูลส่วนตัว</span>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="name">ชื่อ-นามสกุล</label>
                    <input type="text" id="name" name="name" placeholder="ชื่อ-นามสกุล" required>
                </div>
                <div class="form-group">
                    <label for="student-id">เลขทะเบียน</label>
                    <input type="text" id="student-id" name="student-id" placeholder="เลขทะเบียน" required pattern="\d{10}">
                </div>
                <div class="form-group">
                    <label for="major">สาขาวิชา</label>
                    <input type="text" id="major" name="major" placeholder="สาขาวิชา" required>
                </div>
                <div class="form-group">
                    <label for="year">ชั้นปี</label>
                    <input type="text" id="year" name="year" placeholder="ชั้นปี" required pattern="\d{1}">
                </div>
            </div>
            

            <div class="icon">
                <span>ที่อยู่ที่สามารถติดต่อได้</span>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="address">เลขที่</label>
                    <input type="text" id="address" name="address" placeholder="เลขที่" required>
                </div>
                <div class="form-group">
                    <label for="subdistrict">แขวง/ตำบล</label>
                    <input type="text" id="subdistrict" name="subdistrict" placeholder="แขวง/ตำบล" required>
                </div>
                <div class="form-group">
                    <label for="district">เขต/อำเภอ</label>
                    <input type="text" id="district" name="district" placeholder="เขต/อำเภอ" required>
                </div>
                <div class="form-group">
                    <label for="province">จังหวัด</label>
                    <input type="text" id="province" name="province" placeholder="จังหวัด" required>
                </div>
            </div>
            

            <div class="form-row">
                <div class="form-group">
                    <label for="student-phone">โทรศัพท์นักศึกษา</label>
                    <input type="tel" id="student-phone" name="student-phone" placeholder="โทรศัพท์นักศึกษา" required pattern="\d{10}">
                </div>
                <div class="form-group">
                    <label for="parent-phone">โทรศัพท์ผู้ปกครอง</label>
                    <input type="tel" id="parent-phone" name="parent-phone" placeholder="โทรศัพท์ผู้ปกครอง" required pattern="\d{10}">
                </div>
                <div class="form-group">
                    <label for="advisor">อาจารย์ที่ปรึกษา</label>
                    <input type="text" id="advisor" name="advisor" placeholder="อาจารย์ที่ปรึกษา" required>
                </div>
            </div>
            
                

                <form>
                    <!-- วัตถุประสงค์ -->
                    <div class="form-group">
                        <label for="purpose">วัตถุประสงค์ที่จะยื่นคำร้อง</label>
                        <div class="dropdown-wrapper">
                            <select id="purpose" name="purpose" class="centered-dropdown">
                                <option value="register">จดทะเบียนล่าช้า</option>
                                <option value="dropw">ขอถอนวิชา/ถอนรายวิชา (Drop W)</option>
                                <option value="cross-program">ขอจดทะเบียนศึกษารายวิชาข้ามโครงการ</option>
                                <option value="resign">ขอลาออก</option>
                                <option value="other">อื่น ๆ</option>
                            </select>
                        </div>
                    </div>
                    
        
                    <!-- รายละเอียดวิชา -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="semester">ภาคเรียนที่</label>
                            <div style="display: flex; gap: 10px;">
                                <input type="text" id="semester-year" name="semester-year" placeholder="เทอม" style="flex: 1; text-align: center;" required>
                                <span style="align-self: center;">/</span>
                                <input type="text" id="semester-term" name="semester-term" placeholder="ปีกาารศึกษา" style="flex: 1; text-align: center;" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="course-code">รหัสวิชา</label>
                            <input type="text" id="course-code" name="course-code" placeholder="รหัสวิชา" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="course-name">ชื่อวิชา</label>
                            <input type="text" id="course-name" name="course-name" placeholder="ชื่อวิชา" required>
                        </div>
                        <div class="form-group">
                            <label for="section">Section</label>
                            <input type="text" id="section" name="section" placeholder="Section" required>
                        </div>
                    </div>
        
                    <!-- เหตุผล -->
                    <div class="form-group">
                        <label for="purpose">เหตุผลที่ยื่นคำร้อง</label>
                        <div class="dropdown-wrapper">
                            <select id="reason" name="reason" class="centered-dropdown">
                                <option value="financial">ปัญหาด้านการเงิน</option>
                                <option value="academic">ปัญหาด้านสุขภาพ</option>
                                <option value="other">อื่น ๆ</option>
                            </select>
                        </div>
                    </div>
        
                    <!-- รายละเอียดเพิ่มเติม -->
                    <div class="form-group">
                        <label for="details">อื่น ๆ</label>
                        <textarea id="details" name="details" rows="4" placeholder="อธิบาย..."></textarea>
                    </div>
        
                    <!-- แนบเอกสาร -->
                    <div class="form-group">
                        <label for="file-upload">แนบไฟล์เอกสาร</label>
                        <input type="file" id="file-upload" name="file-upload">
                    </div>
        
                    <div class="button-wrapper">
                        <button type="submit" class="submit-btn">ส่งคำร้อง</button>
                    </div>
                    
                </form>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('file-upload').addEventListener('change', function (event) {
            const file = event.target.files[0];
            const allowedExtensions = ['doc', 'docx', 'pdf', 'jpg'];
            const maxSizeMB = 1;
    
            if (file) {
                // ตรวจสอบนามสกุลไฟล์
                const fileExtension = file.name.split('.').pop().toLowerCase();
                if (!allowedExtensions.includes(fileExtension)) {
                    alert('ไฟล์ชนิดนี้ไม่รองรับ');
                    event.target.value = ''; // ล้างค่าฟิลด์
                    return;
                }
    
                // ตรวจสอบขนาดไฟล์
                const fileSizeMB = file.size / (1024 * 1024); // แปลงขนาดเป็น MB
                if (fileSizeMB > maxSizeMB) {
                    alert(`ไฟล์ที่เลือกมีขนาดใหญ่เกิน ${maxSizeMB}MB`);
                    event.target.value = ''; // ล้างค่าฟิลด์
                    return;
                }
    
                alert('ไฟล์ผ่านการตรวจสอบ');
            }
        });
    </script>    
    <script>
        document.getElementById("student-form").addEventListener("submit", function (event) {
            // เก็บฟิลด์ที่ต้องตรวจสอบ
            const requiredFields = ["name", "student-id", "major", "year" , "address" , "subdistrict" , "district" , "province" ,
                "student-phone" , "parent-phone" , "advisor" , "semester-year" , "semester-term" , "course-code" , "course-name" , "section"];
            let isValid = true;
    
            // ตรวจสอบว่าฟิลด์ทุกช่องที่ required ถูกกรอกหรือไม่
            requiredFields.forEach(function (fieldId) {
                const field = document.getElementById(fieldId);
                if (!field.value.trim()) { // เช็คว่าฟิลด์ว่างหรือไม่
                    isValid = false;
                    field.style.border = "2px solid red"; // เปลี่ยนขอบฟิลด์เป็นสีแดง
                } else {
                    field.style.border = ""; // คืนค่าปกติถ้ากรอกแล้ว
                }
            });
    
            if (!isValid) {
                alert("กรุณากรอกข้อมูลให้ครบถ้วน");
                event.preventDefault(); 
            } else {
                window.location.href = 'send.html';
            }
        });
    </script>
    
</body>
</html>
