<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TU Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
            background-image: url('img/background.jpg'); /* Replace with your background image path */
            background-size: cover;
            background-position: center;
        }

        .login-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.9); /* Semi-transparent white */
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            padding: 20px 30px;
            text-align: center;
        }

        .login-container img {
            width: 80px;
            margin-bottom: 10px;
        }

        .login-container h1 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #d81b60; /* TU red color */
        }

        .form-control {
            border-radius: 20px;
        }

        .input-group-text {
            border-radius: 20px 0 0 20px;
        }

        .btn-login {
            width: 100%;
            border-radius: 20px;
            background-color: #d81b60;
            color: white;
        }

        .btn-login:hover {
            background-color: #c2185b;
        }

        .form-check-label {
            font-size: 0.9rem;
        }

        .login-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .login-footer a {
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="img/TU.jpg" alt="TU Logo">
        <h1>TU Login</h1>
        <form>
            <div class="mb-3">
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control" placeholder="Username" id="username" required>
                </div>
            </div>

            <div class="mb-3">
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" placeholder="Password" id="password" required>
                </div>
            </div>

            <div class="login-footer">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                <a href="#">Forgot password?</a>
            </div>

            <button type="button" onclick="submitLoginAndRedirect()" class="btn btn-login mt-3">Login</button>
        </form>
    </div>

    <script>
        function submitLoginAndRedirect() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                alert('Please enter both username and password.');
                return;
            }

            // Example of storing session data (replace with API call)
            sessionStorage.setItem('username', username);
            sessionStorage.setItem('type', 'student');

            window.location.href = 'loginSucc.html';
        }
    </script>
</body>
</html>
