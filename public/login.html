<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .bg-color {
            background-color: #fdf5c9; 
            height: 100vh;
            width: 100%;
            position: relative;
        }
        .bg-image {
            margin-top: 0;
            background-image: url('img/Picture1.png');
            height: calc(100vh - 40px);
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
            filter: brightness(70%);
        }

        .login-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            margin-top: 20px;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-height: 90vh; /* กำหนดความสูงสูงสุดเพื่อไม่ให้กล่องทับ */
            overflow-y: auto; /* ให้สามารถเลื่อนในแนวตั้งได้ */
            padding-bottom: 40px;
        }

        .logo-img {
            margin-top: 20px;
            height: 20%;
        }

        .login-form {
            margin-top: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="bg-color">
        <div style="text-align: center; margin-top: 0; height: 100%;">
            <img src="img/TU.png" alt="TU" class="logo-img">
        </div>
        <div class="login-container">
            <h2 class="text-center">Login Page</h2>
            <form class="login-form">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="username" placeholder="Enter username">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Enter password">
                    </div>
                </div>
                <button type="button" onclick="submitLoginAndRedirect()" class="btn btn-primary w-100">login</button>
            </form>
            <div id="message" class="alert alert-info"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js"></script>
    <script>
        function submitLoginAndRedirect() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    // ตรวจสอบว่า username และ password ไม่ว่าง
    if (!username || !password) {
        alert("Please enter both username and password.");
        return;
    }

    // สมมติว่าเราทำการส่งข้อมูลไปยัง API และได้รับการตอบกลับ (response)
    // ตัวอย่างการเก็บข้อมูลที่ตอบกลับจาก API
    const data = {
        status: 'true',
        message: 'Successful',
        type: 'student',
        tu_status: 'ปกติ',
        statusid: '100',
        displayname_th: 'ณภัทร โตรุ่งเรืองยศ',
        displayname_en: 'naphat torungruengyos',
        email: 'naphat.tor@dome.tu.ac.th',
        department: 'ปริญญาตรีภาคพิเศษ สาขาวิชาวิทยาการคอมพิวเตอร์',
        faculty: 'คณะวิทยาศาสตร์และเทคโนโลยี'
    };

    // เก็บข้อมูลทั้งหมดใน sessionStorage
    sessionStorage.setItem('status', data.status);
    sessionStorage.setItem('tu_status', data.tu_status);
    sessionStorage.setItem('message', data.message);
    sessionStorage.setItem('username', username);
    sessionStorage.setItem('displayname_th', data.displayname_th);
    sessionStorage.setItem('displayname_en', data.displayname_en);
    sessionStorage.setItem('statusid', data.statusid);
    sessionStorage.setItem('email', data.email);
    sessionStorage.setItem('type', data.type);
    sessionStorage.setItem('department', data.department);
    sessionStorage.setItem('faculty', data.faculty);

    // เปลี่ยนหน้าไปที่ submitLogin.html
    window.location.href = 'loginSucc.html';
}

    </script>
</body>
</html>
