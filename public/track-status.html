<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ติดตามสถานะคำร้อง</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <style>
        .logo img {
            max-width: 250px;
        }

        .navbar {
            background-color: #3c3434;
            color: white;
            display: flex;
            padding: 10px 20px;
            justify-content: space-evenly;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-size: 18px;
            padding: 5px 15px;
            font-weight: bold;
        }

        .navbar a.active {
            background-color: #8d1b3d;
            border-radius: 20px;
        }
    </style>
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <img src="img/TU-text.png" alt="Thammasat University Logo">
        </div>
        <div class="user-info">
            <span>Naphat Torungruengyos</span>
            <img src="img/acc1.png" alt="User Avatar">
        </div>
    </div>

    <!-- Navbar -->
    <div class="navbar">
        <a href="req.html">เขียนคำร้อง</a>
        <a href="track-status.html" class="active">ติดตามสถานะคำร้อง</a>
        <a href="status.html">ประวัติการยื่นคำร้อง</a>
    </div>

    <!-- Main Content -->
    <div class="container">
        <h2 class="form-title">ติดตามสถานะคำร้อง</h2>
        <form id="trackForm">
            <label for="requestId">กรุณากรอกหมายเลขคำร้อง:</label>
            <input type="text" id="requestId" required>
            <button type="submit" class="submit-btn" style="background-color: #bab348; color: white; border-radius: 20px; padding: 10px 20px; border: none;">ค้นหา</button>
        </form>
        <div id="result" class="result-card"></div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
